name: Test schedule event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: schedule
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=schedule,pattern=nightly
            type=ref,event=branch
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags output is non-empty
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: tags output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain image name
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage"; then
            echo "FAIL: tags should contain 'myorg/myimage'"
            exit 1
          fi
          echo "PASS"
