name: Test custom separator and bake target
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=raw,value=tag1
            type=raw,value=tag2
          sep-tags: ","
          sep-labels: ","
          bake-target: my-custom-target

      - name: Assert tags use comma separator
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q ","; then
            echo "FAIL: tags output does not contain comma separator"
            exit 1
          fi
          if ! echo "$TAGS" | grep -q "myorg/myimage:tag1"; then
            echo "FAIL: tags does not contain 'myorg/myimage:tag1'"
            exit 1
          fi
          if ! echo "$TAGS" | grep -q "myorg/myimage:tag2"; then
            echo "FAIL: tags does not contain 'myorg/myimage:tag2'"
            exit 1
          fi
          echo "PASS: comma-separated tags correct"

      - name: Assert labels use comma separator
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if ! echo "$LABELS" | grep -q ","; then
            echo "FAIL: labels output does not contain comma separator"
            exit 1
          fi
          echo "PASS: comma-separated labels correct"

      - name: Assert bake-file exists and contains custom target
        env:
          BAKE_FILE: ${{ steps.meta.outputs.bake-file }}
        run: |
          echo "bake-file: $BAKE_FILE"
          if [ -z "$BAKE_FILE" ]; then
            echo "FAIL: bake-file output is empty"
            exit 1
          fi
          if [ ! -f "$BAKE_FILE" ]; then
            echo "FAIL: bake-file path does not exist: $BAKE_FILE"
            exit 1
          fi
          CONTENT=$(cat "$BAKE_FILE")
          echo "bake-file content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "my-custom-target"; then
            echo "FAIL: bake-file does not contain custom target 'my-custom-target'"
            exit 1
          fi
          echo "PASS: bake-file contains custom target"
