name: Test latest flavor on default branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: .
        with:
          images: myorg/myimage
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
      - name: Assert tags contain latest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage:latest"; then
            echo "FAIL: tags should contain 'myorg/myimage:latest'"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain branch name
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage:act-harness"; then
            echo "FAIL: tags should contain 'myorg/myimage:act-harness'"
            exit 1
          fi
          echo "PASS"
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output should not be empty"
            exit 1
          fi
          echo "PASS"
