name: Test custom labels and flavor
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/develop
      GITHUB_EVENT_NAME: push
      GITHUB_SHA: 266574110acf203503badf966df2ea24b5d732d7
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=ref,event=branch
          flavor: |
            latest=false
            prefix=dev-
          labels: |
            org.opencontainers.image.vendor=MyCompany
            custom.label=test-value

      - name: Assert tags contain flavor prefix
        env:
          ACTUAL: ${{ steps.meta.outputs.tags }}
        run: |
          echo "actual tags: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: tags output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "dev-"; then
            echo "FAIL: tags does not contain flavor prefix 'dev-'"
            exit 1
          fi
          echo "PASS: tags contain flavor prefix"

      - name: Assert labels contain custom label
        env:
          ACTUAL: ${{ steps.meta.outputs.labels }}
        run: |
          echo "actual labels: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: labels output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "org.opencontainers.image.vendor=MyCompany"; then
            echo "FAIL: labels does not contain custom vendor label"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q "custom.label=test-value"; then
            echo "FAIL: labels does not contain custom.label"
            exit 1
          fi
          echo "PASS: custom labels present"

      - name: Assert json output contains tags and labels
        env:
          ACTUAL: ${{ steps.meta.outputs.json }}
        run: |
          echo "actual json: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: json output is empty"
            exit 1
          fi
          # Validate JSON and check it has tags and labels keys
          echo "$ACTUAL" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert 'tags' in data, 'json missing tags key'
          assert 'labels' in data, 'json missing labels key'
          print('PASS: json has tags and labels keys')
          " || {
            echo "FAIL: json validation failed"
            exit 1
          }
