name: Test git context mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        uses: .
        with:
          context: git
          images: myorg/myimage
          tags: |
            type=ref,event=branch
            type=sha
      - name: Assert version is not empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags are not empty
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: tags output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert labels are not empty
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "FAIL: labels output should not be empty"
            exit 1
          fi
          echo "PASS"
