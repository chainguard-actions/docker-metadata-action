name: Test git context mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: meta
        uses: .
        with:
          context: git
          images: myorg/myimage
          tags: |
            type=raw,value=git-context-test
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.meta.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version to be non-empty in git context mode"
            exit 1
          fi
          echo "PASS: version is '$ACTUAL'"
      - name: Assert tags output is non-empty
        env:
          ACTUAL: ${{ steps.meta.outputs.tags }}
        run: |
          echo "actual tags: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected tags to be non-empty in git context mode"
            exit 1
          fi
          echo "PASS"
      - name: Assert labels output is non-empty
        env:
          ACTUAL: ${{ steps.meta.outputs.labels }}
        run: |
          echo "actual labels: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected labels to be non-empty in git context mode"
            exit 1
          fi
          echo "PASS"
