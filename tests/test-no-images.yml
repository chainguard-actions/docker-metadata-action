name: Test no images specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: .
        with:
          tags: |
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=NoImageTest
      - name: Assert version output is non-empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output should not be empty even without images"
            exit 1
          fi
          echo "PASS"
      - name: Assert labels output is non-empty
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "FAIL: labels output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert labels contain custom title
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if ! echo "$LABELS" | grep -q "NoImageTest"; then
            echo "FAIL: labels should contain 'NoImageTest'"
            exit 1
          fi
          echo "PASS"
