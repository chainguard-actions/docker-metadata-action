name: Test flavor prefix/suffix and multiple images
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        uses: .
        with:
          images: |
            myorg/myimage
            ghcr.io/myorg/myimage
          tags: |
            type=raw,value=1.0.0
          flavor: |
            suffix=-alpine,onlatest=true

      - name: Assert tags contain suffix for first image
        env:
          ACTUAL: ${{ steps.meta.outputs.tags }}
        run: |
          echo "actual tags: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "myorg/myimage:1.0.0-alpine"; then
            echo "FAIL: expected tags to contain 'myorg/myimage:1.0.0-alpine'"
            exit 1
          fi
          echo "PASS"

      - name: Assert tags contain suffix for second image
        env:
          ACTUAL: ${{ steps.meta.outputs.tags }}
        run: |
          echo "actual tags: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "ghcr.io/myorg/myimage:1.0.0-alpine"; then
            echo "FAIL: expected tags to contain 'ghcr.io/myorg/myimage:1.0.0-alpine'"
            exit 1
          fi
          echo "PASS"

      - name: Assert version reflects suffix
        env:
          ACTUAL: ${{ steps.meta.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0-alpine" ]; then
            echo "FAIL: expected version '1.0.0-alpine', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert tag-names output is non-empty
        env:
          ACTUAL: ${{ steps.meta.outputs.tag-names }}
        run: |
          echo "actual tag-names: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty tag-names output"
            exit 1
          fi
          echo "PASS"
