name: Test semver tag push
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=raw,value=1.2.3
            type=raw,value=1.2
            type=raw,value=1
      - name: Assert version output equals semver
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ "$VERSION" != "1.2.3" ]; then
            echo "FAIL: expected version '1.2.3', got '$VERSION'"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain full semver
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage:1.2.3"; then
            echo "FAIL: tags should contain 'myorg/myimage:1.2.3'"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain major.minor
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage:1.2"; then
            echo "FAIL: tags should contain 'myorg/myimage:1.2'"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain major only
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage:1"; then
            echo "FAIL: tags should contain 'myorg/myimage:1'"
            exit 1
          fi
          echo "PASS"
