name: Test pull request metadata
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=raw,value=pr-42
      - name: Assert version is not empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain PR number
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage:pr-42"; then
            echo "FAIL: tags should contain 'myorg/myimage:pr-42'"
            exit 1
          fi
          echo "PASS"
      - name: Assert labels are not empty
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "FAIL: labels output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert json output is valid JSON
        env:
          JSON: ${{ steps.meta.outputs.json }}
        run: |
          echo "json: $JSON"
          if [ -z "$JSON" ]; then
            echo "FAIL: json output should not be empty"
            exit 1
          fi
          echo "$JSON" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: json output is not valid JSON"
            exit 1
          }
          echo "PASS"
