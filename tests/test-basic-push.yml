name: Test basic push to branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=ref,event=branch
            type=sha

      - name: Assert version is set
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"

      - name: Assert tags are set
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: tags output is empty"
            exit 1
          fi
          echo "PASS: tags=$TAGS"

      - name: Assert labels are set
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "FAIL: labels output is empty"
            exit 1
          fi
          echo "PASS: labels=$LABELS"

      - name: Assert json output is set
        env:
          JSON: ${{ steps.meta.outputs.json }}
        run: |
          echo "json: $JSON"
          if [ -z "$JSON" ]; then
            echo "FAIL: json output is empty"
            exit 1
          fi
          echo "$JSON" | node -e "
            let d='';
            process.stdin.on('data', c => d+=c);
            process.stdin.on('end', () => {
              try { JSON.parse(d); process.exit(0); }
              catch(e) { console.error('Invalid JSON:', e.message); process.exit(1); }
            });
          " || {
            echo "FAIL: json output is not valid JSON"
            exit 1
          }
          echo "PASS: json is valid"

      - name: Assert tags contain image name
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage"; then
            echo "FAIL: tags do not contain image name 'myorg/myimage'"
            exit 1
          fi
          echo "PASS: tags contain image name"
