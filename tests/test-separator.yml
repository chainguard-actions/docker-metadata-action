name: Test custom separator for tags and labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=semver,pattern={{version}},value=v2.0.0
            type=semver,pattern={{major}}.{{minor}},value=v2.0.0
          sep-tags: ','
          sep-labels: ','

      - name: Assert tags use comma separator
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: tags output is empty"
            exit 1
          fi
          if ! echo "$TAGS" | grep -q ","; then
            echo "FAIL: comma separator not found in tags output"
            exit 1
          fi
          echo "PASS: comma separator present in tags"

      - name: Assert labels use comma separator
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "FAIL: labels output is empty"
            exit 1
          fi
          if ! echo "$LABELS" | grep -q ","; then
            echo "FAIL: comma separator not found in labels output"
            exit 1
          fi
          echo "PASS: comma separator present in labels"

      - name: Assert version is 2.0.0
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ "$VERSION" != "2.0.0" ]; then
            echo "FAIL: expected version '2.0.0' but got '$VERSION'"
            exit 1
          fi
          echo "PASS: version=$VERSION"
