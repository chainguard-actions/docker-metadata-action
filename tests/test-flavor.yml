name: Test flavor prefix and suffix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=ref,event=branch
          flavor: |
            suffix=-alpine
            latest=false

      - name: Assert tags are set
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: tags output is empty"
            exit 1
          fi
          echo "PASS: tags=$TAGS"

      - name: Assert suffix is applied to tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "\-alpine"; then
            echo "FAIL: suffix '-alpine' not found in tags"
            exit 1
          fi
          echo "PASS: suffix applied to tags"

      - name: Assert latest tag is not present when flavor latest=false
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if echo "$TAGS" | grep -qE ":latest$|:latest-alpine$"; then
            echo "FAIL: 'latest' tag should not be present when flavor latest=false"
            exit 1
          fi
          echo "PASS: no latest tag as expected"

      - name: Assert version is set
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output is empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
