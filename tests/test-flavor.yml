name: Test flavor options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=raw,value=1.2.3
          flavor: |
            latest=true
            prefix=dev-
            suffix=-alpine
      - name: Assert version is not empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: version output should not be empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain prefix and suffix
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "dev-1.2.3-alpine"; then
            echo "FAIL: tags should contain 'dev-1.2.3-alpine' (prefix+value+suffix)"
            exit 1
          fi
          echo "PASS"
      - name: Assert tags contain latest without prefix and suffix (prefixLatest and suffixLatest default to false)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if ! echo "$TAGS" | grep -q "myorg/myimage:latest"; then
            echo "FAIL: tags should contain 'myorg/myimage:latest' (latest tag does not get prefix/suffix by default)"
            exit 1
          fi
          echo "PASS"
      - name: Assert labels are not empty
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "FAIL: labels output should not be empty"
            exit 1
          fi
          echo "PASS"
