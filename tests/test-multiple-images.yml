name: Test multiple images
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: meta
        uses: .
        with:
          images: |
            myorg/app
            ghcr.io/myorg/app
          tags: |
            type=raw,value=stable
            type=semver,pattern={{version}},value=v2.0.0

      - name: Assert tags contain both images with raw tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "tags:"
          echo "$TAGS"
          if ! echo "$TAGS" | grep -q "myorg/app:stable"; then
            echo "FAIL: tags does not contain 'myorg/app:stable'"
            exit 1
          fi
          if ! echo "$TAGS" | grep -q "ghcr.io/myorg/app:stable"; then
            echo "FAIL: tags does not contain 'ghcr.io/myorg/app:stable'"
            exit 1
          fi
          if ! echo "$TAGS" | grep -q "myorg/app:2.0.0"; then
            echo "FAIL: tags does not contain 'myorg/app:2.0.0'"
            exit 1
          fi
          if ! echo "$TAGS" | grep -q "ghcr.io/myorg/app:2.0.0"; then
            echo "FAIL: tags does not contain 'ghcr.io/myorg/app:2.0.0'"
            exit 1
          fi
          echo "PASS: all image tags present"

      - name: Assert version is 2.0.0
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ "$VERSION" != "2.0.0" ]; then
            echo "FAIL: expected version '2.0.0', got '$VERSION'"
            exit 1
          fi
          echo "PASS: version=$VERSION"

      - name: Assert labels contain both image references
        env:
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          echo "labels: $LABELS"
          if [ -z "$LABELS" ]; then
            echo "FAIL: labels output is empty"
            exit 1
          fi
          echo "PASS: labels present"
