name: Test custom bake target
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@v4
      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=ref,event=branch
          bake-target: my-custom-target
      - name: Assert bake-file contains custom target name
        env:
          BAKE_FILE: ${{ steps.meta.outputs.bake-file }}
        run: |
          echo "bake-file: $BAKE_FILE"
          if [ -z "$BAKE_FILE" ]; then
            echo "FAIL: bake-file output should not be empty"
            exit 1
          fi
          echo "Bake file content:"
          cat "$BAKE_FILE"
          if ! grep -q "my-custom-target" "$BAKE_FILE"; then
            echo "FAIL: bake-file should contain custom target name 'my-custom-target'"
            exit 1
          fi
          echo "PASS"
      - name: Assert bake-file-tags contains custom target name
        env:
          BAKE_FILE_TAGS: ${{ steps.meta.outputs.bake-file-tags }}
        run: |
          echo "bake-file-tags: $BAKE_FILE_TAGS"
          if [ -z "$BAKE_FILE_TAGS" ]; then
            echo "FAIL: bake-file-tags output should not be empty"
            exit 1
          fi
          echo "Bake file tags content:"
          cat "$BAKE_FILE_TAGS"
          if ! grep -q "my-custom-target" "$BAKE_FILE_TAGS"; then
            echo "FAIL: bake-file-tags should contain custom target name 'my-custom-target'"
            exit 1
          fi
          echo "PASS"
