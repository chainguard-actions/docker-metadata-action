name: Test custom labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: meta
        uses: .
        with:
          images: myorg/myimage
          tags: |
            type=raw,value=test
          labels: |
            org.opencontainers.image.title=My Custom Title
            org.opencontainers.image.description=My custom description
            custom.label=custom-value
      - name: Assert custom title label is present
        env:
          ACTUAL: ${{ steps.meta.outputs.labels }}
        run: |
          echo "actual labels: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "org.opencontainers.image.title=My Custom Title"; then
            echo "FAIL: expected label 'org.opencontainers.image.title=My Custom Title' not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom description label is present
        env:
          ACTUAL: ${{ steps.meta.outputs.labels }}
        run: |
          echo "actual labels: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "org.opencontainers.image.description=My custom description"; then
            echo "FAIL: expected label 'org.opencontainers.image.description=My custom description' not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert custom label is present
        env:
          ACTUAL: ${{ steps.meta.outputs.labels }}
        run: |
          echo "actual labels: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "custom.label=custom-value"; then
            echo "FAIL: expected label 'custom.label=custom-value' not found"
            exit 1
          fi
          echo "PASS"
      - name: Assert json output contains labels
        env:
          ACTUAL: ${{ steps.meta.outputs.json }}
        run: |
          echo "actual json: $ACTUAL"
          if ! echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); assert 'labels' in d" 2>/dev/null; then
            echo "FAIL: json output does not contain 'labels' key"
            exit 1
          fi
          echo "PASS"
